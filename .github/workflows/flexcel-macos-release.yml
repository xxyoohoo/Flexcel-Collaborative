# FLEXCEL_PHASE4_UNSIGNED_RELEASE
# FLEXCEL_PHASE5_WINDOWS: Build/verify both Mac DMGs and the Windows installer.
name: Flexcel Collaborative desktop installers

on:
  push:
    branches:
      - fix/old-dependencies
    paths:
      - '.github/workflows/flexcel-macos-release.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'preload.js'
      - '*.html'
      - 'js/**'
      - 'collaboration/**'
      - 'build/**'
      - 'scripts/phase5-verify-windows.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout Flexcel Collaborative
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary for this Mac
        run: npm rebuild electron

      - name: Check PF editor JavaScript
        run: |
          node --check main.js
          node --check preload.js
          node --check js/pf-display-fix.js
          node --check js/pf-layout-fix.js
          node --check js/pf-modern-controls.js
          node --check collaboration/pf-collaboration.js

      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: flexcel-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build and test Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Flexcel Collaborative
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary for Windows
        run: npm rebuild electron

      - name: Check PF editor JavaScript
        run: |
          node --check main.js
          node --check preload.js
          node --check js/pf-display-fix.js
          node --check js/pf-layout-fix.js
          node --check js/pf-modern-controls.js
          node --check collaboration/pf-collaboration.js
          node --check scripts/phase5-verify-windows.cjs

      - name: Build unsigned Windows EXE installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Test packaged app startup, AFF/NEG grid and collaboration controls
        run: node scripts/phase5-verify-windows.cjs

      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: flexcel-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish all three installers to one GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested installers
        uses: actions/download-artifact@v4
        with:
          pattern: flexcel-*
          path: release-files
          merge-multiple: true

      - name: Confirm release assets are present
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-files
          test "$(find release-files -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-files -maxdepth 1 -name '*.exe' | wc -l)" -eq 1

      - name: Publish Mac and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="collab-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/*.dmg release-files/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-files/*.dmg release-files/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Flexcel Collaborative (${GITHUB_SHA:0:7})" \
              --notes "Free, UNSIGNED test builds: Mac arm64 DMG, Mac Intel DMG, and Windows x64 EXE. The Windows build passed packaging and an automated app-launch / PF grid / Collaborate control smoke test. Manually verify on your own devices before using for a tournament. Windows SmartScreen or macOS Gatekeeper may warn about unsigned apps. The room host still needs the collaboration server and tunnel."
          fi
